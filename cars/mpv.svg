<svg class="cm plain anim" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 485"><style>
.cm{font-family:Tahoma,Arial,sans-serif}
.cm .shell{fill:url(#cmPaint);stroke:var(--cm-edge,#3d4652);stroke-width:1.6}
.cm .shellTop{fill:url(#cmPaintTop);stroke:var(--cm-edge,#3d4652);stroke-width:1.6}
.cm .glassp{fill:url(#cmGlass);stroke:#c9ced6;stroke-width:2.4}
.cm .ln{stroke:var(--cm-edge,#3d4652);stroke-width:1.2;fill:none;opacity:.7}
.cm .z{fill:transparent;stroke:var(--cm-xray,#3aa0ff);stroke-opacity:.28;stroke-width:1.1;stroke-dasharray:4 4;cursor:pointer;transition:fill .2s}
.cm .z.panel{stroke:none}
.cm .z:hover{fill:rgba(58,160,255,.18);stroke-opacity:1;stroke-width:2.2}
.cm .z.s-ok{fill:rgba(46,180,95,.42);stroke:#2eb45f;stroke-opacity:1;stroke-dasharray:none}
.cm .z.s-caution{fill:rgba(255,160,0,.62);stroke:#ffa000;stroke-opacity:1;stroke-dasharray:none;filter:url(#cmGlow)}
.cm .z.s-stop{fill:rgba(240,50,50,.68);stroke:#ff3b3b;stroke-opacity:1;stroke-dasharray:none;filter:url(#cmGlow)}
.cm .z.panel.s-ok{fill:rgba(46,180,95,.16)}.cm .z.panel.s-caution{fill:rgba(255,160,0,.35)}.cm .z.panel.s-stop{fill:rgba(240,50,50,.4)}
.cm .cyl{stroke:var(--cm-xray,#3aa0ff)}
.cm .ttl{font-size:17px;font-weight:bold;fill:var(--cm-ink,#1b2430)}
.cm .sub{font-size:12px;fill:var(--cm-mut,#5b6775)}
.cm .mk{cursor:pointer}
.cm .mk circle.dot{stroke:#fff;stroke-width:2}
.cm .mk.s-stop circle{fill:#ff3b3b}.cm .mk.s-caution circle{fill:#ffa000}
.cm .mk text{font-size:12px;font-weight:bold;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.cm .pulse{fill:none;stroke-width:3;opacity:0}
.cm.anim .pulse{animation:cmp 1.6s ease-out infinite}
.cm .mk.s-stop .pulse{stroke:#ff3b3b}.cm .mk.s-caution .pulse{stroke:#ffa000}
.cm.plain .photo{filter:url(#cmSilver)}
.cm.plain .z:not(.s-caution):not(.s-stop){stroke:none;fill:transparent;filter:none}
.cm.plain .z.s-caution,.cm.plain .z.s-stop{stroke:none;filter:url(#cmSoft)}
.cm.plain .z.s-caution{fill:rgba(255,150,0,.55)}.cm.plain .z.s-stop{fill:rgba(235,30,30,.6)}
.cm.plain .z.panel.s-caution{fill:rgba(255,150,0,.3)}.cm.plain .z.panel.s-stop{fill:rgba(235,30,30,.32)}
.cm.plain .floor{display:block}.cm .floor{display:none}
.cm.plain .z:not(.s-caution):not(.s-stop):hover{stroke:#3aa0ff;stroke-opacity:.6;stroke-dasharray:none}
.cm.plain .cyl{stroke:none}.cm.plain .cyl+text{display:none}
@keyframes cmp{0%{r:10px;opacity:.9}100%{r:28px;opacity:0}}
</style><defs>
<linearGradient id="cmPaint" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0" style="stop-color:var(--cm-p1,#f4f6f8)"/><stop offset=".38" style="stop-color:var(--cm-p2,#cfd5dc)"/>
 <stop offset=".55" style="stop-color:var(--cm-p3,#9ea7b1)"/><stop offset=".62" style="stop-color:var(--cm-p2,#cfd5dc)"/>
 <stop offset="1" style="stop-color:var(--cm-p4,#6f7984)"/></linearGradient>
<linearGradient id="cmPaintTop" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0" style="stop-color:var(--cm-p4,#6f7984)"/><stop offset=".22" style="stop-color:var(--cm-p2,#cfd5dc)"/>
 <stop offset=".5" style="stop-color:var(--cm-p1,#f4f6f8)"/><stop offset=".78" style="stop-color:var(--cm-p2,#cfd5dc)"/>
 <stop offset="1" style="stop-color:var(--cm-p4,#6f7984)"/></linearGradient>
<linearGradient id="cmGlass" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0" stop-color="#5d7488"/><stop offset=".45" stop-color="#1f2b37"/><stop offset="1" stop-color="#0f161d"/></linearGradient>
<linearGradient id="cmLower" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/>
 <stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
<radialGradient id="cmTyre"><stop offset=".72" stop-color="#2a2f35"/><stop offset=".9" stop-color="#16191d"/><stop offset="1" stop-color="#0c0e10"/></radialGradient>
<radialGradient id="cmRim" cx=".4" cy=".35"><stop offset="0" stop-color="#f2f4f6"/><stop offset=".6" stop-color="#b5bcc4"/><stop offset="1" stop-color="#7c858f"/></radialGradient>
<linearGradient id="cmTail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a0b10"/><stop offset=".6" stop-color="#d4262f"/><stop offset="1" stop-color="#ff5a5f"/></linearGradient>
<radialGradient id="cmShadow"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<filter id="cmSilver"><feColorMatrix type="saturate" values=".35"/>
 <feComponentTransfer><feFuncR type="linear" slope=".96" intercept=".01"/><feFuncG type="linear" slope=".96" intercept=".015"/><feFuncB type="linear" slope=".98" intercept=".03"/></feComponentTransfer></filter>
<filter id="cmSoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
<radialGradient id="cmFloor"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset=".55" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<filter id="cmGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/>
 <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
